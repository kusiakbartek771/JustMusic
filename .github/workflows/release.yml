# Buduje JustMusic na Windows, Linux i macOS i publikuje pliki w GitHub Releases.
# Uruchamiane po wypchnięciu tagu wersji, np.:  git tag v1.1.0 && git push origin v1.1.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Utwórz wydanie
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "JustMusic ${TAG#v}" --generate-notes

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Zależności systemowe (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm

      - name: Instalacja
        run: npm ci

      - name: Budowanie i publikacja
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish always

  installers:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dołącz małe instalatory (Linux/macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp installer/install.sh JustMusic-Installer-linux-mac.sh
          gh release upload "${GITHUB_REF_NAME}" JustMusic-Installer-linux-mac.sh --clobber
